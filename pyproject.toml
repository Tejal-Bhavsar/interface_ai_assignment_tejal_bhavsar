[project]
name = "interface_ai_assignment_tejal_bhavsar"
version = "1.0.0"
description = "LLM discovery -> typed capability -> deterministic replay computer-use system"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "playwright>=1.50",
  "httpx>=0.27",
  "pydantic>=2.10",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "openai>=1.73"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24"
]

[project.scripts]
cua = "cua.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]